<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Continue on Desktop — Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="options-container">
    <h1>Continue on Desktop</h1>
    <p class="subtitle">Choose which sites show the Desktop button.</p>

    <div class="toggle-row">
      <label for="toggle-claude">
        <span class="toggle-label">claude.ai</span>
      </label>
      <input type="checkbox" id="toggle-claude" checked>
    </div>

    <div class="toggle-row">
      <label for="toggle-chatgpt">
        <span class="toggle-label">chatgpt.com</span>
      </label>
      <input type="checkbox" id="toggle-chatgpt" checked>
    </div>

    <div id="save-status" class="save-status"></div>

    <div class="footer">
      Built by <a href="https://aigarage.in" target="_blank" class="footer-link">AI Garage</a>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
